name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify Maven and Gradle
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || secrets.SONARCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Maven verify
        run: mvn -B -Dstyle.color=never verify

      - name: Install core for Gradle plugin tests
        run: mvn -B -pl depviz-core -am install -DskipTests

      - name: Gradle plugin tests
        run: ./gradlew :depviz-gradle-plugin:test --rerun-tasks --no-daemon

      - name: Verify coverage reports
        run: |
          reports=(
            "depviz-core/target/site/jacoco/jacoco.xml"
            "depviz-maven-plugin/target/site/jacoco/jacoco.xml"
            "depviz-cli/target/site/jacoco/jacoco.xml"
            "depviz-gradle-plugin/build/reports/jacoco/test/jacocoTestReport.xml"
            "viewer/coverage/lcov.info"
          )

          for report in "${reports[@]}"; do
            if [ ! -s "$report" ]; then
              echo "::error file=$report::Coverage report was not generated or is empty"
              exit 1
            fi
            wc -c "$report"
          done

      - name: Require Sonar token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Set SONAR_TOKEN or SONARCLOUD_TOKEN in GitHub repository secrets so CI can publish coverage to SonarCloud."
            exit 1
          fi

      - name: Sonar scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v7
