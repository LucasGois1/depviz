name: Publish Gradle Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "${GRADLE_PUBLISH_KEY}" || { echo "Missing GRADLE_PUBLISH_KEY" >&2; exit 2; }
          test -n "${GRADLE_PUBLISH_SECRET}" || { echo "Missing GRADLE_PUBLISH_SECRET" >&2; exit 2; }

      - name: Set project version
        run: scripts/set-version.sh "${{ inputs.version }}"

      - name: Install core for Gradle plugin publication
        run: mvn -B -pl depviz-core -am install -DskipTests

      - name: Publish plugin
        run: ./gradlew :depviz-gradle-plugin:publishPlugins --no-daemon
